name: release-promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository state
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend[dev]
          python -m pytest backend/tests -q
          kubectl kustomize deployment/kubernetes/overlays/${{ github.event.inputs.environment }} >/tmp/rendered-${{ github.event.inputs.environment }}.yaml
      - name: Enforce release gate
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "Production promotion requires manual approval and release lock acknowledgement."
          fi
      - name: Update release metadata
        run: |
          echo "Promotion workflow for ${{ github.event.inputs.environment }} is valid."
