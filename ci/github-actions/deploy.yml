name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend[dev]
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Validate kustomize
        run: |
          kubectl kustomize deployment/kubernetes >/tmp/rendered.yaml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Argo CD
        run: echo "Argo CD sync is managed by the GitOps repository; this workflow validates deployment definitions."
