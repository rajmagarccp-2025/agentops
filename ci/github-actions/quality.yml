name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend[dev]
      - name: Ruff
        run: python -m ruff check backend/src backend/tests backend/migrations
      - name: Mypy
        run: python -m mypy backend/src
      - name: Tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node node_modules/next/dist/bin/next lint
      - run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kustomize validation
        run: |
          kubectl kustomize deployment/kubernetes/base >/tmp/base.yaml
          kubectl kustomize deployment/kubernetes/overlays/dev >/tmp/dev.yaml
          kubectl kustomize deployment/kubernetes/overlays/staging >/tmp/staging.yaml
          kubectl kustomize deployment/kubernetes/overlays/prod >/tmp/prod.yaml
      - name: Secret placeholder scan
        run: |
          ! grep -R "replace-with-.*secret\|password.*replace" deployment infrastructure --include='*.yaml' --include='*.tf'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
