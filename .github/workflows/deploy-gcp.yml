name: Deploy AgentOps application to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Build and publish this commit, or redeploy an existing image tag
        required: true
        default: build_and_deploy
        type: choice
        options:
          - build_and_deploy
          - deploy_existing
      image_tag:
        description: Full 40-character commit SHA; required for existing-image redeployment
        required: false
        type: string
      run_migrations:
        description: Run the chart's database migration job (review application migration risk first)
        required: true
        default: false
        type: boolean

concurrency:
  group: agentops-gcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Run application and configuration checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Scan, publish, and deploy application
    needs: quality
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_PROJECT_NAME: ${{ vars.GCP_PROJECT_NAME }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ENVIRONMENT: ${{ vars.GCP_ENVIRONMENT }}
      GCP_NAMESPACE: ${{ vars.GCP_NAMESPACE }}
      GCP_CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME }}
      GCP_REPOSITORY: ${{ vars.GCP_REPOSITORY }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCS_DOCUMENT_BUCKET: ${{ vars.GCS_DOCUMENT_BUCKET }}
      DEPLOYMENT_MODE: ${{ github.event_name == 'push' && 'build_and_deploy' || inputs.deployment_mode }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate target, immutable tag, and protected configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PUBLISHER_SERVICE_ACCOUNT: ${{ secrets.GCP_PUBLISHER_SERVICE_ACCOUNT }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          TF_DATABASE_PASSWORD: ${{ secrets.TF_DATABASE_PASSWORD }}
          JWT_DEMO_SECRET: ${{ secrets.JWT_DEMO_SECRET }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Production application deployment must run from the protected main branch."
            exit 1
          }
          : "${GCP_PROJECT_ID:?Set the prod environment variable GCP_PROJECT_ID}"
          : "${GCP_PROJECT_NUMBER:?Set the prod environment variable GCP_PROJECT_NUMBER}"
          : "${GCP_PROJECT_NAME:?Set the prod environment variable GCP_PROJECT_NAME}"
          : "${GCP_REGION:?Set the prod environment variable GCP_REGION}"
          : "${GCP_ENVIRONMENT:?Set the prod environment variable GCP_ENVIRONMENT}"
          : "${GCP_NAMESPACE:?Set the prod environment variable GCP_NAMESPACE}"
          : "${GCP_CLUSTER_NAME:?Set the prod environment variable GCP_CLUSTER_NAME}"
          : "${GCP_REPOSITORY:?Set the prod environment variable GCP_REPOSITORY}"
          : "${GCP_RUNTIME_SERVICE_ACCOUNT:?Set GCP_RUNTIME_SERVICE_ACCOUNT in the prod environment}"
          : "${GCS_DOCUMENT_BUCKET:?Set GCS_DOCUMENT_BUCKET in the prod environment}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set GCP_WORKLOAD_IDENTITY_PROVIDER in the prod environment}"
          : "${GCP_DEPLOYER_SERVICE_ACCOUNT:?Set GCP_DEPLOYER_SERVICE_ACCOUNT in the prod environment}"
          : "${TF_DATABASE_PASSWORD:?Set TF_DATABASE_PASSWORD in the prod environment}"
          : "${JWT_DEMO_SECRET:?Set JWT_DEMO_SECRET in the prod environment}"
          : "${OIDC_ISSUER_URL:?Set OIDC_ISSUER_URL in the prod environment}"
          : "${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in the prod environment}"
          : "${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in the prod environment}"
          [[ "$GCP_ENVIRONMENT" == "prod" ]] || {
            echo "Production application deployment requires GCP_ENVIRONMENT=prod."
            exit 1
          }
          [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "GCP_PROJECT_NUMBER must contain only digits."
            exit 1
          }
          [[ "$GCP_PROJECT_NAME" =~ ^[a-z][a-z0-9-]{0,29}$ ]] || {
            echo "GCP_PROJECT_NAME does not match the Terraform resource-prefix format."
            exit 1
          }
          [[ "$GCP_CLUSTER_NAME" == "$GCP_PROJECT_NAME-$GCP_ENVIRONMENT" ]] || {
            echo "GCP_CLUSTER_NAME must match the Terraform-managed cluster name."
            exit 1
          }
          [[ "$GCP_REPOSITORY" == "$GCP_PROJECT_NAME-$GCP_ENVIRONMENT" ]] || {
            echo "GCP_REPOSITORY must match the Terraform-managed Artifact Registry repository."
            exit 1
          }
          [[ "$GCP_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#GCP_NAMESPACE} -le 63 ]] || {
            echo "GCP_NAMESPACE must be a Kubernetes DNS label of at most 63 characters."
            exit 1
          }
          [[ "$GCP_RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || {
            echo "GCP_RUNTIME_SERVICE_ACCOUNT does not match the Terraform service-account format."
            exit 1
          }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "IMAGE_TAG must be a lowercase 40-character Git commit SHA."
            exit 1
          }
          case "$DEPLOYMENT_MODE" in
            build_and_deploy)
              [[ "$IMAGE_TAG" == "$GITHUB_SHA" ]] || {
                echo "Builds may only publish the SHA of the checked-out commit."
                exit 1
              }
              : "${GCP_PUBLISHER_SERVICE_ACCOUNT:?Set GCP_PUBLISHER_SERVICE_ACCOUNT in the prod environment}"
              ;;
            deploy_existing) ;;
            *)
              echo "Unsupported deployment mode."
              exit 1
              ;;
          esac
          case "$OIDC_ISSUER_URL" in
            https://*) ;;
            *)
              echo "OIDC_ISSUER_URL must use HTTPS."
              exit 1
              ;;
          esac
          case "$OIDC_ISSUER_URL" in
            *localhost*|*127.0.0.1*)
              echo "OIDC_ISSUER_URL must not point to a local development service."
              exit 1
              ;;
          esac

      - name: Build API, worker, and frontend images
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        run: |
          set -euo pipefail
          registry="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY"
          docker build -t "$registry/platform-api:$IMAGE_TAG" -f docker/backend.Dockerfile .
          docker build -t "$registry/platform-worker:$IMAGE_TAG" -f docker/worker.Dockerfile .
          docker build -t "$registry/platform-frontend:$IMAGE_TAG" -f docker/frontend.Dockerfile .

      - name: Scan API image before publication
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan worker image before publication
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-worker:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image before publication
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Authenticate as Artifact Registry publisher
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PUBLISHER_SERVICE_ACCOUNT }}

      - name: Set up gcloud for Artifact Registry publication
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify repository and prevent immutable-tag replacement
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$project_number" == "$GCP_PROJECT_NUMBER" ]] || {
            echo "The configured project ID and number do not identify the same GCP project."
            exit 1
          }
          repository_format="$(gcloud artifacts repositories describe "$GCP_REPOSITORY" \
            --location "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(format)')"
          [[ "$repository_format" == "DOCKER" ]] || {
            echo "The configured Artifact Registry repository is missing or is not a Docker repository."
            exit 1
          }
          images_json="$(gcloud artifacts docker images list \
            "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY" \
            --include-tags --format=json)"
          for image in platform-api platform-worker platform-frontend; do
            if jq -e --arg tag "$IMAGE_TAG" \
              'any(.[]; any(.tags[]?; . == $tag or endswith(":" + $tag)))' \
              <<< "$images_json" >/dev/null; then
              echo "Refusing to overwrite existing immutable tag $IMAGE_TAG for $image."
              exit 1
            fi
          done

      - name: Configure Docker and publish approved images
        if: ${{ env.DEPLOYMENT_MODE == 'build_and_deploy' }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          registry="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY"
          docker push "$registry/platform-api:$IMAGE_TAG"
          docker push "$registry/platform-worker:$IMAGE_TAG"
          docker push "$registry/platform-frontend:$IMAGE_TAG"

      - name: Authenticate as application deployer
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud and GKE authentication
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Verify existing GCP infrastructure readiness
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$project_number" == "$GCP_PROJECT_NUMBER" ]] || {
            echo "The configured project ID and number do not identify the same GCP project."
            exit 1
          }
          cluster_status="$(gcloud container clusters describe "$GCP_CLUSTER_NAME" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status)')"
          [[ "$cluster_status" == "RUNNING" ]] || {
            echo "The configured GKE cluster is missing or not RUNNING."
            exit 1
          }
          sql_instance_name="$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-db"
          sql_instance="$(gcloud sql instances describe "$sql_instance_name" \
            --project "$GCP_PROJECT_ID" --format=json)"
          [[ "$(jq -r '.state // empty' <<< "$sql_instance")" == "RUNNABLE" ]] || {
            echo "The Terraform-managed Cloud SQL instance is missing or not RUNNABLE."
            exit 1
          }
          database_private_ip="$(jq -r \
            '[.ipAddresses[]? | select(.type == "PRIVATE") | .ipAddress][0] // empty' \
            <<< "$sql_instance")"
          [[ -n "$database_private_ip" ]] || {
            echo "The Cloud SQL instance has no private IP address."
            exit 1
          }
          redis_instance_name="$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-redis"
          redis_instance="$(gcloud redis instances describe "$redis_instance_name" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json)"
          [[ "$(jq -r '.state // empty' <<< "$redis_instance")" == "READY" ]] || {
            echo "The Terraform-managed Memorystore Redis instance is missing or not READY."
            exit 1
          }
          redis_host="$(jq -r '.host // empty' <<< "$redis_instance")"
          [[ -n "$redis_host" ]] || {
            echo "The Memorystore Redis instance has no host endpoint."
            exit 1
          }
          repository_format="$(gcloud artifacts repositories describe "$GCP_REPOSITORY" \
            --location "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(format)')"
          [[ "$repository_format" == "DOCKER" ]] || {
            echo "The configured Artifact Registry repository is missing or is not usable."
            exit 1
          }
          gcloud storage buckets describe "gs://$GCS_DOCUMENT_BUCKET" \
            --project "$GCP_PROJECT_ID" --format=json >/dev/null
          gcloud iam service-accounts describe \
            "$GCP_RUNTIME_SERVICE_ACCOUNT@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --project "$GCP_PROJECT_ID" >/dev/null
          for secret_id in \
            agentops-database-url \
            agentops-redis-url \
            agentops-jwt-secret \
            agentops-oidc-issuer \
            agentops-oidc-client-id \
            agentops-oidc-client-secret
          do
            gcloud secrets describe "$secret_id" --project "$GCP_PROJECT_ID" >/dev/null
          done
          printf 'DATABASE_PRIVATE_IP=%s\nREDIS_HOST=%s\n' \
            "$database_private_ip" "$redis_host" >> "$GITHUB_ENV"

      - name: Pull and scan existing images for redeployment
        if: ${{ env.DEPLOYMENT_MODE == 'deploy_existing' }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          registry="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY"
          docker pull "$registry/platform-api:$IMAGE_TAG"
          docker pull "$registry/platform-worker:$IMAGE_TAG"
          docker pull "$registry/platform-frontend:$IMAGE_TAG"

      - name: Scan existing API image
        if: ${{ env.DEPLOYMENT_MODE == 'deploy_existing' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan existing worker image
        if: ${{ env.DEPLOYMENT_MODE == 'deploy_existing' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-worker:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan existing frontend image
        if: ${{ env.DEPLOYMENT_MODE == 'deploy_existing' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REPOSITORY }}/platform-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Obtain existing cluster credentials
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$GCP_CLUSTER_NAME" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"
          kubectl cluster-info
          kubectl create namespace "$GCP_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Seed only empty Secret Manager secrets and project current versions
        env:
          TF_DATABASE_PASSWORD: ${{ secrets.TF_DATABASE_PASSWORD }}
          JWT_DEMO_SECRET: ${{ secrets.JWT_DEMO_SECRET }}
          OIDC_ISSUER_URL: ${{ secrets.OIDC_ISSUER_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          issuer_metadata="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 \
            "$OIDC_ISSUER_URL/.well-known/openid-configuration")"
          printf '%s' "$issuer_metadata" | jq -e --arg issuer "$OIDC_ISSUER_URL" \
            '.issuer == $issuer' >/dev/null
          encoded_password="$(python -c 'import os; from urllib.parse import quote; print(quote(os.environ["TF_DATABASE_PASSWORD"], safe=""))')"
          database_url="postgresql+psycopg://platform:${encoded_password}@${DATABASE_PRIVATE_IP}:5432/agentops?sslmode=require"
          redis_url="redis://${REDIS_HOST}:6379/0"
          seed_secret_if_empty() {
            local secret_id="$1"
            local initial_value="$2"
            local existing_versions
            existing_versions="$(gcloud secrets versions list "$secret_id" \
              --project "$GCP_PROJECT_ID" --limit=1 --format='value(name)')"
            if [[ -z "$existing_versions" ]]; then
              printf '%s' "$initial_value" |
                gcloud secrets versions add "$secret_id" \
                  --project "$GCP_PROJECT_ID" --data-file=- >/dev/null
            fi
          }
          seed_secret_if_empty agentops-database-url "$database_url"
          seed_secret_if_empty agentops-redis-url "$redis_url"
          seed_secret_if_empty agentops-jwt-secret "$JWT_DEMO_SECRET"
          seed_secret_if_empty agentops-oidc-issuer "$OIDC_ISSUER_URL"
          seed_secret_if_empty agentops-oidc-client-id "$OIDC_CLIENT_ID"
          seed_secret_if_empty agentops-oidc-client-secret "$OIDC_CLIENT_SECRET"
          secret_env_file="$(mktemp)"
          trap 'rm -f "$secret_env_file"' EXIT
          database_url="$(gcloud secrets versions access latest --secret=agentops-database-url --project "$GCP_PROJECT_ID")"
          redis_url="$(gcloud secrets versions access latest --secret=agentops-redis-url --project "$GCP_PROJECT_ID")"
          jwt_secret="$(gcloud secrets versions access latest --secret=agentops-jwt-secret --project "$GCP_PROJECT_ID")"
          oidc_issuer="$(gcloud secrets versions access latest --secret=agentops-oidc-issuer --project "$GCP_PROJECT_ID")"
          oidc_client_id="$(gcloud secrets versions access latest --secret=agentops-oidc-client-id --project "$GCP_PROJECT_ID")"
          oidc_client_secret="$(gcloud secrets versions access latest --secret=agentops-oidc-client-secret --project "$GCP_PROJECT_ID")"
          printf 'DATABASE_URL=%s\nREDIS_URL=%s\nJWT_DEMO_SECRET=%s\nJWT_SECRET_KEY=%s\nOIDC_ISSUER_URL=%s\nOIDC_CLIENT_ID=%s\nOIDC_CLIENT_SECRET=%s\n' \
            "$database_url" "$redis_url" "$jwt_secret" "$jwt_secret" \
            "$oidc_issuer" "$oidc_client_id" "$oidc_client_secret" > "$secret_env_file"
          kubectl create secret generic platform-secrets \
            --namespace "$GCP_NAMESPACE" \
            --from-env-file="$secret_env_file" \
            --dry-run=client -o yaml | kubectl apply -f - >/dev/null

      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Upgrade application release
        run: |
          set -euo pipefail
          helm upgrade --install agentops-platform deployment/helm/platform \
            --namespace "$GCP_NAMESPACE" \
            --create-namespace \
            --values deployment/helm/platform/values-gcp.yaml \
            --set global.environment=production \
            --set namespace="$GCP_NAMESPACE" \
            --set serviceAccount.name="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --set-string "serviceAccount.annotations.iam\.gke\.io/gcp-service-account=$GCP_RUNTIME_SERVICE_ACCOUNT@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --set-string rag.gcsDocumentBucket="$GCS_DOCUMENT_BUCKET" \
            --set-string secretManager.projectId="$GCP_PROJECT_ID" \
            --set-string llm.vertexProjectId="$GCP_PROJECT_ID" \
            --set-string workflowQueue.projectId="$GCP_PROJECT_ID" \
            --set-string workflowQueue.topicId="$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-events" \
            --set-string workflowQueue.subscriptionId="$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-events" \
            --set migration.enabled="$RUN_MIGRATIONS" \
            --set migration.image.repository="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-api" \
            --set migration.image.tag="$IMAGE_TAG" \
            --set api.image.repository="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-api" \
            --set api.image.tag="$IMAGE_TAG" \
            --set worker.image.repository="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-worker" \
            --set worker.image.tag="$IMAGE_TAG" \
            --set frontend.image.repository="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-frontend" \
            --set frontend.image.tag="$IMAGE_TAG" \
            --wait --timeout 10m

      - name: Verify application rollouts
        run: |
          set -euo pipefail
          for deployment in \
            agentops-platform-api \
            agentops-platform-worker \
            agentops-platform-frontend \
            agentops-platform-kong \
            agentops-platform-opa \
            agentops-platform-otel-collector
          do
            kubectl rollout status "deployment/$deployment" \
              --namespace "$GCP_NAMESPACE" \
              --timeout=5m
          done
          kubectl get deployments --namespace "$GCP_NAMESPACE"
