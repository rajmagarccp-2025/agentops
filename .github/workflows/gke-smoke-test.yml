name: GKE Deployment Smoke Test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing Artifact Registry image tag to check
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-cks-aug2026
  GCP_REGION: us-central1
  GCP_CLUSTER_NAME: agentops-platform-prod
  GCP_REPOSITORY: agentops-platform-prod
  SMOKE_NAMESPACE: agentops-smoke-${{ github.run_id }}-${{ github.run_attempt }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  smoke-test:
    name: Verify GKE scheduling and image pulls
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get cluster credentials
        run: |
          gcloud container clusters get-credentials "$GCP_CLUSTER_NAME" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Schedule temporary image-check pods
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "IMAGE_TAG contains unsupported characters."
            exit 1
          fi

          kubectl create namespace "$SMOKE_NAMESPACE"
          kubectl apply --namespace "$SMOKE_NAMESPACE" -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: image-pull-check
            labels:
              app.kubernetes.io/name: agentops-image-pull-check
          spec:
            automountServiceAccountToken: false
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: api-image
                image: "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-api:$IMAGE_TAG"
                imagePullPolicy: Always
                command: ["python", "-c"]
                args: ["import time; time.sleep(600)"]
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
              - name: worker-image
                image: "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-worker:$IMAGE_TAG"
                imagePullPolicy: Always
                command: ["python", "-c"]
                args: ["import time; time.sleep(600)"]
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
              - name: frontend-image
                image: "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_REPOSITORY/platform-frontend:$IMAGE_TAG"
                imagePullPolicy: Always
                command: ["node", "-e"]
                args: ["setTimeout(() => {}, 600000)"]
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
          EOF

          if ! kubectl wait --namespace "$SMOKE_NAMESPACE" \
            --for=condition=Ready pod/image-pull-check --timeout=8m; then
            kubectl describe pod image-pull-check --namespace "$SMOKE_NAMESPACE"
            kubectl get events --namespace "$SMOKE_NAMESPACE" \
              --sort-by=.metadata.creationTimestamp
            exit 1
          fi
          kubectl get pod image-pull-check --namespace "$SMOKE_NAMESPACE" -o wide

      - name: Remove temporary smoke-test namespace
        if: ${{ always() }}
        run: |
          if kubectl config current-context >/dev/null 2>&1; then
            kubectl delete namespace "$SMOKE_NAMESPACE" \
              --ignore-not-found --wait=true --timeout=2m
          else
            echo "No Kubernetes context was established; no smoke-test namespace was created."
          fi
