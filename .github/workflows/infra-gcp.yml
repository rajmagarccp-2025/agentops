name: GCP infrastructure lifecycle

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit infrastructure operation; this workflow never runs on application pushes
        required: true
        type: choice
        options:
          - bootstrap
          - plan
          - apply
          - drift
      state_mode:
        description: Use existing state, or explicitly initialize a verified empty state for a new environment
        required: true
        default: existing
        type: choice
        options:
          - existing
          - initialize

concurrency:
  group: agentops-gcp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap or verify remote state storage
    if: ${{ inputs.operation == 'bootstrap' }}
    runs-on: ubuntu-latest
    environment: prod-infra-bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_TF_STATE_LOCATION: ${{ vars.GCP_TF_STATE_LOCATION }}
    steps:
      - name: Validate bootstrap target
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_BOOTSTRAP_SERVICE_ACCOUNT: ${{ secrets.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}
          GCP_INFRA_SERVICE_ACCOUNT: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Infrastructure operations must run from the protected main branch."
            exit 1
          }
          : "${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          : "${GCP_PROJECT_NUMBER:?Set repository variable GCP_PROJECT_NUMBER}"
          : "${GCP_REGION:?Set repository variable GCP_REGION}"
          : "${GCP_TF_STATE_BUCKET:?Set repository variable GCP_TF_STATE_BUCKET}"
          : "${GCP_TF_STATE_LOCATION:?Set repository variable GCP_TF_STATE_LOCATION}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set repository secret GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_BOOTSTRAP_SERVICE_ACCOUNT:?Set repository secret GCP_BOOTSTRAP_SERVICE_ACCOUNT}"
          : "${GCP_INFRA_SERVICE_ACCOUNT:?Set repository secret GCP_INFRA_SERVICE_ACCOUNT}"
          [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "GCP_PROJECT_NUMBER must contain only digits."
            exit 1
          }
          [[ "$GCP_TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo "GCP_TF_STATE_BUCKET is not a valid GCS bucket name."
            exit 1
          }

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BOOTSTRAP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify project, create bucket if absent, and enforce state protections
        env:
          GCP_INFRA_SERVICE_ACCOUNT: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$project_number" == "$GCP_PROJECT_NUMBER" ]] || {
            echo "The configured project ID and number do not identify the same GCP project."
            exit 1
          }
          bucket_json="$RUNNER_TEMP/state-bucket.json"
          if ! gcloud storage buckets describe "gs://$GCP_TF_STATE_BUCKET" \
            --project "$GCP_PROJECT_ID" --format=json > "$bucket_json"; then
            gcloud storage buckets create "gs://$GCP_TF_STATE_BUCKET" \
              --project "$GCP_PROJECT_ID" \
              --location "$GCP_TF_STATE_LOCATION" \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://$GCP_TF_STATE_BUCKET" \
            --versioning \
            --uniform-bucket-level-access \
            --public-access-prevention
          gcloud storage buckets describe "gs://$GCP_TF_STATE_BUCKET" \
            --project "$GCP_PROJECT_ID" --format=json > "$bucket_json"
          jq -e \
            --arg project_number "$GCP_PROJECT_NUMBER" \
            --arg location "$GCP_TF_STATE_LOCATION" \
            '.projectNumber == $project_number and
             (.location | ascii_downcase) == ($location | ascii_downcase) and
             .versioning.enabled == true and
             .iamConfiguration.uniformBucketLevelAccess.enabled == true and
             .iamConfiguration.publicAccessPrevention == "enforced"' \
            "$bucket_json" >/dev/null || {
              echo "The existing state bucket owner, location, or security settings do not match configuration."
              exit 1
            }
          gcloud storage buckets add-iam-policy-binding "gs://$GCP_TF_STATE_BUCKET" \
            --member="serviceAccount:$GCP_INFRA_SERVICE_ACCOUNT" \
            --role="roles/storage.objectAdmin" \
            --project "$GCP_PROJECT_ID"
          echo "State bucket is secure and scoped OpenTofu state access is configured. No state object was created or modified."
          {
            echo "## GCP remote state bootstrap"
            echo "- Project: \`$GCP_PROJECT_ID\`"
            echo "- State bucket: \`gs://$GCP_TF_STATE_BUCKET\`"
            echo "- Operation: create-if-absent, verify, configure protections, grant bucket-scoped state access"
            echo "- State object: not created or modified"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Validate and create infrastructure plan
    if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' || inputs.operation == 'drift' }}
    runs-on: ubuntu-latest
    outputs:
      plan_mac: ${{ steps.encrypt-plan.outputs.plan_mac }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_PROJECT_NAME: ${{ vars.GCP_PROJECT_NAME }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ENVIRONMENT: ${{ vars.GCP_ENVIRONMENT }}
      GCP_NAMESPACE: ${{ vars.GCP_NAMESPACE }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_TF_STATE_OBJECT: ${{ vars.GCP_TF_STATE_OBJECT }}
      GCP_TF_STATE_LOCATION: ${{ vars.GCP_TF_STATE_LOCATION }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_name: ${{ vars.GCP_PROJECT_NAME }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_environment: ${{ vars.GCP_ENVIRONMENT }}
      TF_VAR_namespace: ${{ vars.GCP_NAMESPACE }}
      TF_VAR_service_account_name: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      TF_VAR_enable_public_edge: ${{ vars.GCP_ENABLE_PUBLIC_EDGE || 'false' }}
      TF_VAR_enable_public_dns_record: ${{ vars.GCP_ENABLE_PUBLIC_DNS_RECORD || 'false' }}
      TF_VAR_public_domain: ${{ vars.GCP_DOMAIN }}
      TF_VAR_dns_managed_zone: ${{ vars.GCP_DNS_MANAGED_ZONE }}
      TF_VAR_database_password: ${{ secrets.TF_DATABASE_PASSWORD }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_INFRA_SERVICE_ACCOUNT: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
    steps:
      - name: Validate infrastructure configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Infrastructure operations must run from the protected main branch."
            exit 1
          }
          : "${GCP_PROJECT_ID:?Set repository variable GCP_PROJECT_ID}"
          : "${GCP_PROJECT_NUMBER:?Set repository variable GCP_PROJECT_NUMBER}"
          : "${GCP_PROJECT_NAME:?Set repository variable GCP_PROJECT_NAME}"
          : "${GCP_REGION:?Set repository variable GCP_REGION}"
          : "${GCP_ENVIRONMENT:?Set repository variable GCP_ENVIRONMENT}"
          : "${GCP_NAMESPACE:?Set repository variable GCP_NAMESPACE}"
          : "${GCP_RUNTIME_SERVICE_ACCOUNT:?Set repository variable GCP_RUNTIME_SERVICE_ACCOUNT}"
          : "${GCP_CLUSTER_NAME:?Set repository variable GCP_CLUSTER_NAME}"
          : "${GCP_TF_STATE_BUCKET:?Set repository variable GCP_TF_STATE_BUCKET}"
          : "${GCP_TF_STATE_OBJECT:?Set repository variable GCP_TF_STATE_OBJECT}"
          : "${GCP_TF_STATE_LOCATION:?Set repository variable GCP_TF_STATE_LOCATION}"
          : "${TF_VAR_database_password:?Set repository secret TF_DATABASE_PASSWORD}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Set repository secret GCP_WORKLOAD_IDENTITY_PROVIDER}"
          : "${GCP_INFRA_SERVICE_ACCOUNT:?Set repository secret GCP_INFRA_SERVICE_ACCOUNT}"
          [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "GCP_PROJECT_NUMBER must contain only digits."
            exit 1
          }
          [[ "$GCP_PROJECT_NAME" =~ ^[a-z][a-z0-9-]{0,29}$ ]] || {
            echo "GCP_PROJECT_NAME does not match the Terraform resource-prefix format."
            exit 1
          }
          [[ "$GCP_CLUSTER_NAME" == "$GCP_PROJECT_NAME-$GCP_ENVIRONMENT" ]] || {
            echo "GCP_CLUSTER_NAME must match the Terraform-managed cluster name."
            exit 1
          }
          [[ "$GCP_TF_STATE_OBJECT" == */default.tfstate && "$GCP_TF_STATE_OBJECT" != *//* && "$GCP_TF_STATE_OBJECT" != *..* ]] || {
            echo "GCP_TF_STATE_OBJECT must be a safe object path ending in /default.tfstate."
            exit 1
          }
          [[ "${{ inputs.operation }}" != "drift" || "${{ inputs.state_mode }}" == "existing" ]] || {
            echo "Drift detection requires existing remote state."
            exit 1
          }
          if [[ "${{ inputs.operation }}" == "apply" ]]; then
            : "${TF_PLAN_ENCRYPTION_KEY:?Set repository secret TF_PLAN_ENCRYPTION_KEY}"
            [[ ${#TF_PLAN_ENCRYPTION_KEY} -ge 32 ]] || {
              echo "TF_PLAN_ENCRYPTION_KEY must contain at least 32 characters."
              exit 1
            }
          fi

      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - name: Verify project, bucket, and state lifecycle
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$project_number" == "$GCP_PROJECT_NUMBER" ]] || {
            echo "The configured project ID and number do not identify the same GCP project."
            exit 1
          }
          bucket_json="$(gcloud storage buckets describe "gs://$GCP_TF_STATE_BUCKET" \
            --project "$GCP_PROJECT_ID" --format=json)"
          printf '%s' "$bucket_json" | jq -e \
            --arg project_number "$GCP_PROJECT_NUMBER" \
            --arg location "$GCP_TF_STATE_LOCATION" \
            '.projectNumber == $project_number and
             (.location | ascii_downcase) == ($location | ascii_downcase) and
             .versioning.enabled == true and
             .iamConfiguration.uniformBucketLevelAccess.enabled == true and
             .iamConfiguration.publicAccessPrevention == "enforced"' >/dev/null || {
              echo "The configured state bucket is missing, belongs to another project, or fails security checks."
              exit 1
            }
          state_uri="gs://$GCP_TF_STATE_BUCKET/$GCP_TF_STATE_OBJECT"
          state_exists=false
          if gcloud storage ls "$state_uri" >/dev/null 2>&1; then
            state_exists=true
          fi
          if [[ "${{ inputs.state_mode }}" == "existing" && "$state_exists" != true ]]; then
            echo "Expected remote state is missing or inaccessible. Stop and recover/verify state; do not initialize an empty backend."
            exit 1
          fi
          if [[ "${{ inputs.state_mode }}" == "initialize" && "$state_exists" == true ]]; then
            echo "Refusing state initialization because the configured state object already exists."
            exit 1
          fi
          if [[ "${{ inputs.state_mode }}" == "initialize" && "${{ inputs.operation }}" == "drift" ]]; then
            echo "Drift detection cannot initialize state."
            exit 1
          fi
      - name: Initialize configured GCS backend and validate
        working-directory: infrastructure/terraform/gcp
        run: |
          set -euo pipefail
          state_prefix="${GCP_TF_STATE_OBJECT%/default.tfstate}"
          tofu init -input=false -reconfigure \
            -backend-config="bucket=$GCP_TF_STATE_BUCKET" \
            -backend-config="prefix=$state_prefix"
          tofu validate
          if [[ "${{ inputs.state_mode }}" == "existing" ]]; then
            state_cluster="$(tofu output -raw cluster_name)"
            [[ "$state_cluster" == "$GCP_CLUSTER_NAME" ]] || {
              echo "The selected state does not identify the configured Terraform-managed cluster."
              exit 1
            }
          fi
      - name: Detect drift without applying changes
        if: ${{ inputs.operation == 'drift' }}
        working-directory: infrastructure/terraform/gcp
        run: |
          set -euo pipefail
          set +e
          tofu plan -refresh-only -detailed-exitcode -input=false -no-color
          result=$?
          set -e
          if [[ "$result" -eq 1 ]]; then
            echo "OpenTofu drift check failed."
            exit 1
          elif [[ "$result" -eq 2 ]]; then
            echo "Drift detected. No changes were applied."
            exit 1
          fi
          echo "No infrastructure drift detected."
      - name: Create reviewable infrastructure plan
        if: ${{ inputs.operation == 'plan' || inputs.operation == 'apply' }}
        working-directory: infrastructure/terraform/gcp
        run: tofu plan -input=false -no-color -out=tfplan
      - name: Encrypt saved plan for protected apply
        id: encrypt-plan
        if: ${{ inputs.operation == 'apply' }}
        working-directory: infrastructure/terraform/gcp
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -salt -iter 600000 \
            -pass env:TF_PLAN_ENCRYPTION_KEY \
            -in tfplan -out "$RUNNER_TEMP/tfplan.enc"
          plan_mac="$(openssl dgst -sha256 -hmac "$TF_PLAN_ENCRYPTION_KEY" \
            "$RUNNER_TEMP/tfplan.enc" | awk '{print $NF}')"
          echo "plan_mac=$plan_mac" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted plan for the protected apply job
        if: ${{ inputs.operation == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/tfplan.enc
          if-no-files-found: error
          retention-days: 1
      - name: Record plan or drift-check audit metadata
        if: ${{ inputs.operation != 'drift' }}
        run: |
          {
            echo "## GCP infrastructure ${{ inputs.operation }}"
            echo "- Project: \`$GCP_PROJECT_ID\`"
            echo "- State: \`gs://$GCP_TF_STATE_BUCKET/$GCP_TF_STATE_OBJECT\`"
            echo "- State mode: \`${{ inputs.state_mode }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Apply: requires approval in the protected \`prod-infra-apply\` environment."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply the exact saved infrastructure plan
    needs: plan
    if: ${{ inputs.operation == 'apply' }}
    runs-on: ubuntu-latest
    environment: prod-infra-apply
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_PROJECT_NAME: ${{ vars.GCP_PROJECT_NAME }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ENVIRONMENT: ${{ vars.GCP_ENVIRONMENT }}
      GCP_CLUSTER_NAME: ${{ vars.GCP_CLUSTER_NAME }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_TF_STATE_OBJECT: ${{ vars.GCP_TF_STATE_OBJECT }}
      GCP_TF_STATE_LOCATION: ${{ vars.GCP_TF_STATE_LOCATION }}
      TF_DATABASE_PASSWORD: ${{ secrets.TF_DATABASE_PASSWORD }}
      TF_PLAN_ENCRYPTION_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
      TF_PLAN_MAC: ${{ needs.plan.outputs.plan_mac }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - name: Download encrypted plan from this run
        uses: actions/download-artifact@v4
        with:
          name: tofu-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/tofu-plan
      - name: Re-verify state destination and apply exact saved plan
        working-directory: infrastructure/terraform/gcp
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Infrastructure apply must run from the protected main branch."
            exit 1
          }
          project_number="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(projectNumber)')"
          [[ "$project_number" == "$GCP_PROJECT_NUMBER" ]] || {
            echo "The configured project ID and number do not identify the same GCP project."
            exit 1
          }
          gcloud storage buckets describe "gs://$GCP_TF_STATE_BUCKET" \
            --project "$GCP_PROJECT_ID" --format=json |
            jq -e \
              --arg project_number "$GCP_PROJECT_NUMBER" \
              --arg location "$GCP_TF_STATE_LOCATION" \
              '.projectNumber == $project_number and
               (.location | ascii_downcase) == ($location | ascii_downcase) and
               .versioning.enabled == true and
               .iamConfiguration.uniformBucketLevelAccess.enabled == true and
               .iamConfiguration.publicAccessPrevention == "enforced"' >/dev/null
          state_uri="gs://$GCP_TF_STATE_BUCKET/$GCP_TF_STATE_OBJECT"
          state_exists=false
          if gcloud storage ls "$state_uri" >/dev/null 2>&1; then
            state_exists=true
          fi
          if [[ "${{ inputs.state_mode }}" == "existing" && "$state_exists" != true ]]; then
            echo "Expected remote state disappeared before apply; aborting."
            exit 1
          fi
          if [[ "${{ inputs.state_mode }}" == "initialize" && "$state_exists" == true ]]; then
            echo "State appeared after planning; refusing to apply a plan against a changed state lifecycle."
            exit 1
          fi
          expected_mac="$TF_PLAN_MAC"
          actual_mac="$(openssl dgst -sha256 -hmac "$TF_PLAN_ENCRYPTION_KEY" \
            "$RUNNER_TEMP/tofu-plan/tfplan.enc" | awk '{print $NF}')"
          [[ "$actual_mac" == "$expected_mac" ]] || {
            echo "Saved plan integrity check failed; refusing to apply."
            exit 1
          }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:TF_PLAN_ENCRYPTION_KEY \
            -in "$RUNNER_TEMP/tofu-plan/tfplan.enc" -out tfplan
          state_prefix="${GCP_TF_STATE_OBJECT%/default.tfstate}"
          tofu init -input=false -reconfigure \
            -backend-config="bucket=$GCP_TF_STATE_BUCKET" \
            -backend-config="prefix=$state_prefix"
          if [[ "${{ inputs.state_mode }}" == "existing" ]]; then
            state_cluster="$(tofu output -raw cluster_name)"
            [[ "$state_cluster" == "$GCP_CLUSTER_NAME" ]] || {
              echo "The selected state no longer identifies the configured cluster."
              exit 1
            }
          fi
          tofu apply -input=false tfplan
          test -n "$(tofu output -raw cluster_name)"
          test -n "$(tofu output -raw database_private_ip)"
          test -n "$(tofu output -raw redis_host)"
          gcloud storage ls "$state_uri" >/dev/null
      - name: Verify provisioned services and record infrastructure version
        run: |
          set -euo pipefail
          cluster_name="$(tofu -chdir=infrastructure/terraform/gcp output -raw cluster_name)"
          [[ "$cluster_name" == "$GCP_CLUSTER_NAME" ]] || {
            echo "The provisioned cluster output does not match GCP_CLUSTER_NAME."
            exit 1
          }
          cluster_status="$(gcloud container clusters describe "$cluster_name" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status)')"
          [[ "$cluster_status" == "RUNNING" ]] || {
            echo "The provisioned GKE cluster is not RUNNING."
            exit 1
          }
          sql_status="$(gcloud sql instances describe "$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-db" \
            --project "$GCP_PROJECT_ID" --format='value(state)')"
          [[ "$sql_status" == "RUNNABLE" ]] || {
            echo "The provisioned Cloud SQL instance is not RUNNABLE."
            exit 1
          }
          redis_status="$(gcloud redis instances describe "$GCP_PROJECT_NAME-$GCP_ENVIRONMENT-redis" \
            --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(state)')"
          [[ "$redis_status" == "READY" ]] || {
            echo "The provisioned Memorystore instance is not READY."
            exit 1
          }
          {
            echo "## GCP infrastructure apply complete"
            echo "- Project: \`$GCP_PROJECT_ID\`"
            echo "- State: \`gs://$GCP_TF_STATE_BUCKET/$GCP_TF_STATE_OBJECT\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Verified: GKE RUNNING, Cloud SQL RUNNABLE, Memorystore READY, remote state accessible."
          } >> "$GITHUB_STEP_SUMMARY"
