name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pytest pytest-asyncio ruff
      - name: Lint and test backend
        run: |
          ruff check backend/src backend/tests/test_opa_client.py backend/tests/test_observability.py
          pytest backend/tests

  frontend-test:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run build

  helm-validation:
    name: Helm and rendered configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      - name: Lint and render cloud charts
        run: |
          helm lint deployment/helm/platform --values deployment/helm/platform/values-gcp.yaml
          helm template agentops-gcp deployment/helm/platform \
            --namespace validation \
            --values deployment/helm/platform/values-gcp.yaml \
            --set global.environment=production \
            --set namespace=validation
          helm template agentops-aws deployment/helm/platform \
            --values deployment/helm/platform/values-aws.yaml
          helm template agentops-azure deployment/helm/platform \
            --values deployment/helm/platform/values-azure.yaml
          helm template agentops-openshift deployment/helm/platform \
            --values deployment/helm/platform/values-openshift.yaml
      - name: Validate GCP Gateway templates
        run: |
          helm template agentops-gcp-gateway deployment/helm/platform \
            --values deployment/helm/platform/values-gcp.yaml \
            --set gateway.enabled=true \
            --set gateway.domain=api.example.com \
            --set gateway.staticAddressName=test-public-edge \
            --set gateway.certificateMap=projects/test/locations/global/certificateMaps/test \
            --set gateway.cloudArmorPolicy=test-edge-policy
      - name: Parse rendered Kong configuration
        run: |
          set -euo pipefail
          rendered_config="$RUNNER_TEMP/platform-rendered.yaml"
          kong_config="$RUNNER_TEMP/kong.yml"
          helm template agentops-platform deployment/helm/platform \
            --namespace validation \
            --values deployment/helm/platform/values-gcp.yaml \
            --set global.environment=production \
            --set namespace=validation > "$rendered_config"
          ruby -ryaml -e '
            documents = YAML.load_stream(File.read(ARGV[0]))
            config = documents.find do |document|
              document.is_a?(Hash) &&
                document["kind"] == "ConfigMap" &&
                document.dig("metadata", "name") == "agentops-platform-kong-config"
            end
            abort "Rendered Kong ConfigMap was not found" unless config
            File.write(ARGV[1], config.fetch("data").fetch("kong.yml"))
          ' "$rendered_config" "$kong_config"
          docker run --rm \
            --env KONG_DATABASE=off \
            --volume "$kong_config:/kong.yml:ro" \
            --entrypoint kong kong:3.9.1 config parse /kong.yml

  policy-validation:
    name: OPA policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check packaged policy matches tested policy
        run: cmp policy/agentops/authz.rego deployment/helm/platform/policy/agentops/authz.rego
      - name: Format, check, and test Rego
        run: |
          docker run --rm -v "$PWD/policy:/policy" openpolicyagent/opa:1.4.2 fmt --fail /policy
          docker run --rm -v "$PWD/policy:/policy" openpolicyagent/opa:1.4.2 check --strict /policy
          docker run --rm -v "$PWD/policy:/policy" openpolicyagent/opa:1.4.2 test -v /policy

  opentofu-validation:
    name: OpenTofu format and backend-free validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure/terraform/gcp
      - name: Validate configuration without remote state
        working-directory: infrastructure/terraform/gcp
        run: |
          tofu init -backend=false -input=false
          tofu validate
