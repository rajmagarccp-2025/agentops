name: CI / CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend
          pip install pytest pytest-asyncio ruff mypy
      - name: Lint Code
        run: ruff check backend/src
      - name: Run Pytest Suite
        run: pytest backend/tests

  frontend-test:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Typecheck TypeScript
        run: |
          cd frontend
          npm run typecheck
      - name: Build Next.js
        run: |
          cd frontend
          npm run build

  helm-validation:
    name: Helm Lint & Template Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Application Helm Chart
        run: |
          helm lint deployment/helm/platform
      - name: Validate GCP Helm Templates
        run: |
          helm template test-gcp deployment/helm/platform -f deployment/helm/platform/values-gcp.yaml
      - name: Validate AWS Helm Templates
        run: |
          helm template test-aws deployment/helm/platform -f deployment/helm/platform/values-aws.yaml
      - name: Validate Azure Helm Templates
        run: |
          helm template test-azure deployment/helm/platform -f deployment/helm/platform/values-azure.yaml
      - name: Validate OpenShift Helm Templates
        run: |
          helm template test-ocp deployment/helm/platform -f deployment/helm/platform/values-openshift.yaml

  docker-build-and-scan:
    name: Container Build & Vulnerability Scan
    needs: [backend-test, frontend-test, helm-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API Container Image
        run: |
          docker build -t platform-api:${{ github.sha }} -f docker/backend.Dockerfile .
      - name: Build Worker Container Image
        run: |
          docker build -t platform-worker:${{ github.sha }} -f docker/worker.Dockerfile .
      - name: Build Frontend Container Image
        run: |
          docker build -t platform-frontend:${{ github.sha }} -f docker/frontend.Dockerfile .

