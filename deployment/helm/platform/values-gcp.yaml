global:
  cloudProvider: gcp

serviceAccount:
  create: true
  name: platform-sa-gcp
  annotations:
    iam.gke.io/gcp-service-account: "platform-sa@PROJECT_ID.iam.gserviceaccount.com"

ingress:
  className: gce
  annotations:
    kubernetes.io/ingress.class: "gce"
    ingress.gcp.kubernetes.io/pre-shared-cert: "platform-cert"

config:
  database:
    sslMode: verify-ca
