global:
  environment: production
  cloudProvider: gcp
  clusterDomain: cluster.local

namespace: prod

serviceAccount:
  create: true
  name: agentops-platform-sa-gcp
  annotations:
    iam.gke.io/gcp-service-account: "agentops-platform-sa-gcp@project-cks-aug2026.iam.gserviceaccount.com"

ingress:
  enabled: false
  className: gce
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: "platform-cert"

config:
  database:
    sslMode: require

serviceMonitor:
  enabled: false
