{{- if .Values.secrets.externalSecretRef.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecretRef.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.data.databaseUrlKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.databaseUrl | default "platform/database-url" }}
    - secretKey: {{ .Values.secrets.data.redisUrlKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.redisUrl | default "platform/redis-url" }}
    - secretKey: {{ .Values.secrets.data.jwtSecretKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.jwtSecret | default "platform/jwt-secret" }}
    - secretKey: {{ .Values.secrets.data.oidcIssuerUrlKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.oidcIssuerUrl | default "platform/oidc-issuer-url" }}
    - secretKey: {{ .Values.secrets.data.oidcClientIdKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.oidcClientId | default "platform/oidc-client-id" }}
    - secretKey: {{ .Values.secrets.data.oidcClientSecretKey }}
      remoteRef:
        key: {{ .Values.secrets.externalSecretRef.remoteKeys.oidcClientSecret | default "platform/oidc-client-secret" }}
{{- end -}}
