{{- if .Values.secrets.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.data.databaseUrl | default "" | b64enc | quote }}
  REDIS_URL: {{ .Values.secrets.data.redisUrl | default "" | b64enc | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.data.jwtSecret | default "" | b64enc | quote }}
{{- end -}}
