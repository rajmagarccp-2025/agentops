apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web
  namespace: agentic-platform
  labels:
    app.kubernetes.io/name: platform-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-web
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: agentic-platform-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://platform-api:8000/api/v1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-web
  namespace: agentic-platform
  labels:
    app.kubernetes.io/name: platform-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-web
  ports:
    - name: http
      port: 3000
      targetPort: http
