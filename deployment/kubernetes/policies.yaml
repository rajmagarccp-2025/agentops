apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-api
  namespace: agentic-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-web
  namespace: agentic-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-api
  namespace: agentic-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-web
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-web
  namespace: agentic-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-api
      ports:
        - protocol: TCP
          port: 8000
