apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: agentic-platform-dev
data:
  APP_ENV: development
  LOG_LEVEL: DEBUG
  DEMO_MODE: "true"
  OTEL_SERVICE_NAME: agentic-platform-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: agentic-platform-dev
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web
  namespace: agentic-platform-dev
spec:
  replicas: 1
