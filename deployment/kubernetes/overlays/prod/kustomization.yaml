apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentic-platform-prod
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: platform-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: platform-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
