apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-platform-release-orchestrator
  namespace: argocd
spec:
  project: agentic-platform
  source:
    repoURL: https://github.com/example/platform.git
    targetRevision: main
    path: deployment/kubernetes/overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: agentic-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
  revisionHistoryLimit: 5
