apiVersion: v1
kind: Namespace
metadata:
  name: agentic-platform-prod
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-platform-prod
  namespace: argocd
spec:
  project: agentic-platform
  source:
    repoURL: https://github.com/example/platform.git
    targetRevision: main
    path: deployment/helm/platform
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: namespace
          value: agentic-platform-prod
        - name: global.environment
          value: production
  destination:
    server: https://kubernetes.default.svc
    namespace: agentic-platform-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
