apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
type: Opaque
stringData:
  admin.password: "$2a$10$Q9Q1F5xjL9Zs1V3K8mn8gO1rR5YcL9m6u3O5lq9y2ChbP4Ew4U9G2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      containers:
        - name: argocd-server
          image: quay.io/argoproj/argocd:v2.13.0
          ports:
            - containerPort: 8080
          env:
            - name: ARGOCD_ADMIN_PASSWORD
              value: "$2a$10$Q9Q1F5xjL9Zs1V3K8mn8gO1rR5YcL9m6u3O5lq9y2ChbP4Ew4U9G2"
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
