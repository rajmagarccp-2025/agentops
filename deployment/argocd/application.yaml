apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-project
  source:
    repoURL: 'https://github.com/org/platform-repo.git'
    targetRevision: main
    path: deployment/helm/platform
    helm:
      valueFiles:
        - values.yaml
        - values-gcp.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: platform-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
