apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-multi-cloud
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: prod
            cloud: gcp
            valuesFile: values-gcp.yaml
            namespace: prod
  template:
    metadata:
      name: 'agentops-platform-{{env}}-{{cloud}}'
    spec:
      project: platform-project
      source:
        repoURL: https://github.com/rajmagarccp-2025/agentops.git
        targetRevision: main
        path: deployment/helm/platform
        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
          parameters:
            - name: global.environment
              value: '{{env}}'
            - name: namespace
              value: '{{namespace}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
